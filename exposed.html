try{JSON.parse(localStorage.getItem('exposed_reports')||'[]').forEach(r=>{r.id=R.length;R.push(r)})}catch(e){}
const WU=.4;// unverified weight
function stats(id){const rs=R.filter(r=>r.v===id),n=rs.length;if(!n)return{n:0};
const w=r=>r.ver?1:WU,W=rs.reduce((a,r)=>a+w(r),0),avg=k=>rs.reduce((a,r)=>a+(r[k]-1)/4*w(r),0)/W*100;
const comp=rs.filter(r=>r.f.length),res=comp.length?comp.filter(r=>r.res==='resolved').length/comp.length*100:100;
const ev=rs.filter(r=>r.ver).length/n*100;
const parts=[['Service quality',avg('s'),30],['Promise fulfilment',avg('p'),25],['Transparency',avg('t'),20],['Complaint resolution',res,15],['Evidence verified',ev,10]];
const score=Math.round(parts.reduce((a,p)=>a+p[1]*p[2]/100,0));
const fl={};rs.forEach(r=>r.f.forEach(f=>fl[f]=(fl[f]||0)+1));
return{n,ver:rs.filter(r=>r.ver).length,parts,score,fl,enough:n>=5,rs}}
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const starIc=on=>`<svg viewBox="0 0 24 24" fill="${on?'currentColor':'none'}"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>`;
function list(q){const ql=q.toLowerCase();
const rows=V.filter(v=>(!city||v.city===city)&&(!starOnly||stars.includes(v.id))&&(v.name+v.city+v.country).toLowerCase().includes(ql)).sort((a,b)=>stars.includes(b.id)-stars.includes(a.id)).map(v=>{const s=stats(v.id),on=stars.includes(v.id);
return `<div class="sw"><button class="stbtn" onclick="tgStar('${v.id}')" aria-label="${on?'Unstar':'Star'} venue">${starIc(on)}</button><a class="li" draggable="false" href="#/venue/${v.id}"><span class="ico">${ini(v)}</span><span class="tx"><b>${esc(nm(v))}${on?'<svg class="sti" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>':''}</b><small>${v.real?'':'Demo · '}${v.city}, ${v.country}</small></span><span class="rt"><b class="${s.enough&&s.score<50?'low':''}">${sc(s)}</b><small>${on?'Starred · ':''}${s.n} reports</small></span></a></div>`}).join('');
return (rows||'<p class="mut">No venue found.</p>')+(rows||starOnly?'':'<a class="cta" href="#/report" onclick="F.nv={name:($(\'#q\')||{}).value||\'\',city:city,country:\'Germany\'}">Add it and report</a>')}
const newSess=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();let gSess=newSess(),gTimer;

const r2=await fetch('/api/place?id='+encodeURIComponent(m.id)+'&s='+gSess);if(!r2.ok)throw 0;const p=await r2.json();gSess=newSess();
if(p.rating){v.g=[p.rating,p.count];gc[v.id]=v.g;try{localStorage.setItem('exposed_gc',JSON.stringify(gc))}catch(e){}}}catch(e){}

const icn=c=>`<svg viewBox="0 0 24 24"><path d="${ICON[c][0]}"/>${ICON[c][1]?`<path d="${ICON[c][1]}" fill="currentColor"/>`:''}</svg>`;const CITIES=['Berlin','Munich','Hamburg','Frankfurt','Cologne','Stuttgart','Düsseldorf'];let city='';const chips=()=>['All',...CITIES].map(c=>`<button class="chp ${(c==='All'?!city:city===c)?'on':''}" onclick="setCity('${c}')">${icn(c)}${c}</button>`).join('')+`<button class="chp ${starOnly?'on':''}" onclick="togStarOnly()">${starIc(starOnly)}Starred</button>`;window.togStarOnly=()=>{starOnly=!starOnly;$('#cities').innerHTML=chips();hs($('#q').value)};window.setCity=c=>{starOnly=false;city=c==='All'?'':c;$('#cities').innerHTML=chips();hs($('#q').value)};const home=()=>`<div class="top"><a class="av" href="#/">E</a><input id="q" class="pill" placeholder="Search venues in Germany" value="${esc(lastQ)}" aria-label="Search venues" oninput="hs(this.value)"></div>
<div class="cities" id="cities">${chips()}</div><div class="bal"><div class="lbl">Experiences on record</div><div class="num">${R.length}</div><span class="chip2">${R.filter(r=>r.ver).length} verified · ${V.length} venues · ${R.filter(r=>r.sid).length} live reports</span></div>
<div class="acts">${act('#/report',I.plus,'Report')}${act('#/report',I.addb,'Add venue',"onclick=\"F.nv={name:'',city:'',country:'Germany'}\"")}${act('#/flags',I.flag,'Red flags')}${act('#/respond',I.bld,'For venues')}</div>
<div id="gres"></div><div class="h">Venues</div><div id="res">${list(lastQ)}</div>`;
let all=false;window.more=()=>{all=true;route()};
const cmp=(v,st)=>{if(!v.g)return v.real?'<p class="mut c">'+(v.gdone?'Google rating not found.':'Checking Google rating…')+'</p>':'';const e=st.enough?st.score/20:null,d=e?v.g[0]-e:0;
return `<div class="cmp"><div><div class="lbl">Google</div><div class="cn">${v.g[0].toFixed(1)}</div><small>${v.g[1].toLocaleString()} reviews</small></div><div><div class="lbl">EXPOSED</div><div class="cn ${e&&e<2.5?'low':''}">${e?e.toFixed(1):'–'}</div><small>${st.n} reports</small></div></div>${e?`<p class="mut c" style="margin:0 0 20px">${d>=1?'Google rates this '+d.toFixed(1)+' stars higher than EXPOSED reports.':d<=-1?'EXPOSED reports rate this '+(-d).toFixed(1)+' stars higher than Google.':'Google and EXPOSED broadly agree.'}${v.real?'':' Demo figures.'}</p>`:''}`};
function venue(id){const v=V.find(x=>x.id===id);if(!v)return'<p>Venue not found.</p>';const st=stats(id);
const top=st.n?Object.entries(st.fl).sort((a,b)=>b[1]-a[1]).slice(0,3):[];const rs=(st.rs||[]).slice().reverse();
return back('#/',esc(nm(v)))+`<div class="bal"><div class="lbl">Accountability score</div>${st.enough?`<div class="num ${st.score<50?'low':''}">${st.score}<small>/100</small></div>`:`<div class="num" style="font-size:1.9rem;letter-spacing:-.02em">Not enough reports yet</div>`}<span class="chip2">${v.real?'Public listing':'Demo'} · ${v.city}, ${v.country} · ${st.n} reports${st.n?', '+st.ver+' verified':''}</span></div>
${cmp(v,st)}
<div class="acts">${act('#/report/'+id,I.plus,'Report')}<button class="act" onclick="tgStar('${id}')"><span class="ci">${starIc(stars.includes(id))}</span>${stars.includes(id)?'Starred':'Star'}</button>${act('#/flags',I.flag,'Red flags')}${act('#/respond',I.bld,'For venues')}</div>
${st.enough?`<details class="sheet"><summary>How the score works</summary><p class="mut">Verified reports count fully, unverified count 40%.</p>${st.parts.map(p=>`<div class="mut">${p[0]} · ${Math.round(p[1])}</div><span class="bar"><u style="width:${p[1]}%;background:var(--fg)"></u></span>`).join('')}</details>`:'<p class="mut c">A score needs 5 reports.</p>'}
${top.length?`<div class="h">Most reported</div>${top.map(([k,c])=>`<div class="li"><span class="ico r">!</span><span class="tx"><b>${FLAGS[k]}</b><small>${Math.round(c/st.n*100)}% of reports</small></span><span class="rt"><b>${c} of ${st.n}</b></span></div>`).join('')}`:''}
<div class="h">Reports</div>${rs.slice(0,all?99:3).map(r=>`<div class="li top"><span class="ico">${r.ver?'✓':'?'}</span><span class="tx"><small>Promised</small><b>${esc(r.pr)}</b><small style="margin-top:6px">Delivered</small><b>${esc(r.de)}</b>${r.resp?`<span class="resp"><b>Venue response</b>${esc(r.resp)}</span>`:''}</span><span class="rt"><small class="${r.ver?'ok':''}">${r.ver?'Verified':'Unverified'}${r.pend?'<br>Pending':''}</small></span></div>`).join('')||'<p class="mut">No reports yet.</p>'}${!all&&rs.length>3?`<button class="more" onclick="more()">Show all ${rs.length}</button>`:''}`}
let step=0,F={f:[]};
const Q=[
()=>F.nv?`<h1 class="q">Add the venue</h1>${[['name','Venue name'],['city','City'],['country','Country']].map(([k,l])=>`<input class="in" style="margin-bottom:8px" placeholder="${l}" value="${esc(F.nv[k])}" oninput="F.nv.${k}=this.value">`).join('')}<button class="lk" onclick="F.nv=null;rep()">Choose from list instead</button>`:`<h1 class="q">Which venue?</h1><select class="in" onchange="F.venue=this.value"><option value="">Choose a venue</option>${V.map(v=>`<option value="${v.id}" ${F.venue===v.id?'selected':''}>${esc(nm(v))}</option>`).join('')}</select><button class="lk" onclick="F.nv={name:'',city:'',country:'Germany'};rep()">Not listed? Add a venue</button>`,
()=>`<h1 class="q">What did they promise?</h1><textarea class="in" rows="4" oninput="F.pr=this.value" placeholder="Example: Buffet for 200 guests until 11pm">${esc(F.pr||'')}</textarea>`,
()=>`<h1 class="q">What actually happened?</h1><textarea class="in" rows="4" oninput="F.de=this.value" placeholder="Example: Main dishes ran out at 9:15pm">${esc(F.de||'')}</textarea>`,
()=>`<h1 class="q">Any of these?</h1><div class="chps">${Object.entries(FLAGS).map(([k,l])=>`<button class="chp ${F.f.includes(k)?'on':''}" onclick="tg('${k}')">${l}</button>`).join('')}</div>`,
()=>`<h1 class="q">Did they deliver what they promised?</h1><div class="rate">${[1,2,3,4,5].map(n=>`<button class="${F.p==n?'on':''}" onclick="F.p=${n};go(1)">${n}</button>`).join('')}</div><p class="mut">1 = not at all, 5 = fully</p>`,
()=>`<h1 class="q">Add proof</h1><input type="file" id="ev" class="in" multiple accept="image/*,.pdf"><p class="mut">Optional and private. Contracts, invoices or photos help verify your report. Not uploaded in this demo.</p><label style="display:flex;gap:10px;margin-top:16px"><input type="checkbox" id="ok" style="width:22px;height:22px;flex:none">I attended or paid for this event, and this is truthful.</label>`];
const need=['venue','pr','de',null,'p',null];
window.tg=k=>{F.f=F.f.includes(k)?F.f.filter(x=>x!==k):F.f.concat(k);rep()};
window.go=d=>{if(d>0&&step===0&&F.nv){const n=F.nv;if(!n.name.trim()||!n.city.trim()){$('#err').textContent='Add a name and city.';return}const v={id:'u'+Date.now(),name:n.name.trim(),city:n.city.trim(),country:n.country.trim()||'Germany',type:'Venue',claimed:false};V.push(v);try{const a=JSON.parse(localStorage.getItem('exposed_venues')||'[]');a.push(v);localStorage.setItem('exposed_venues',JSON.stringify(a))}catch(e){}try{fetch('/api/venue',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(v)}).catch(()=>{})}catch(e){}F.venue=v.id;F.nv=null}
if(d>0&&need[step]&&!F[need[step]]){$('#err').textContent='Please complete this step.';return}step=Math.max(0,step+d);rep()};
window.sub=async()=>{if(!$('#ok').checked){$('#err').textContent='Please confirm to submit.';return}
const r={v:F.venue,ver:0,s:F.p,t:F.p,p:F.p,f:F.f,pr:F.pr,de:F.de,tx:'',date:new Date().toISOString().slice(0,7),res:F.f.length?'open':'none',resp:null,pend:1};let saved=false;
try{const res=await fetch('/api/report',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({v:r.v,pr:r.pr,de:r.de,f:r.f,p:r.p})});
if(res.status===429){$('#err').textContent='You already reported this venue recently, or are sending too fast.';return}
if(res.status===400){$('#err').textContent='Please add more detail to your report.';return}
if(res.ok){const x=await res.json();x.id=R.length;R.push(x);saved=true}}catch(e){}
if(!saved){try{const a=JSON.parse(localStorage.getItem('exposed_reports')||'[]');a.push(r);localStorage.setItem('exposed_reports',JSON.stringify(a))}catch(e){}r.id=R.length;R.push(r)}
const v=F.venue;F={f:[]};step=0;$('#app').innerHTML=`<div class="bal" style="padding-top:80px"><div class="num" style="font-size:3rem">Thank you</div><p class="mut">Your report is pending review and shown as unverified. Your name is never shown.</p></div><a class="cta" href="#/venue/${v}">See the venue</a>`};
function rep(){$('#app').innerHTML=`<div class="top2"><button class="ci" aria-label="Back" onclick="${step?'go(-1)':"location.hash='#/'"}">${ic(I.back)}</button><div class="prog"><u style="width:${(step+1)/Q.length*100}%"></u></div><span class="sp"></span></div>${Q[step]()}<div class="err" id="err"></div>${step===4?'':step===5?'<button class="cta" onclick="sub()">Submit report</button>':'<button class="cta" onclick="go(1)">Continue</button>'}`}
function flags(){const a={};R.forEach(r=>r.f.forEach(f=>a[f]=(a[f]||0)+1));const T=R.length;
return back('#/','Red flags')+`<h1 class="q">Most reported problems</h1><p class="mut">Across ${T} fictional demo reports.</p>${Object.entries(a).sort((x,y)=>y[1]-x[1]).map(([k,c])=>`<div class="li"><span class="ico r">!</span><span class="tx"><b>${FLAGS[k]}</b><span class="bar"><u style="width:${c/T*100}%"></u></span></span><span class="rt"><b>${c}</b></span></div>`).join('')}`}
let rv='v1';window.setRv=v=>{rv=v;route()};
window.reply=id=>{const t=$('#t'+id).value.trim();if(!t)return;R[id].resp=t;R[id].res='resolved';route()};
function respond(){const rs=R.filter(r=>r.v===rv&&r.f.length);
return back('#/','For venues')+`<h1 class="q">Respond to reports</h1><p class="mut">Reply publicly. Reports can’t be edited or removed.</p><select class="in" onchange="setRv(this.value)">${V.map(x=>`<option value="${x.id}" ${x.id===rv?'selected':''}>${esc(nm(x))}</option>`).join('')}</select>
${rs.map(r=>`<div class="li top"><span class="ico r">!</span><span class="tx"><small>Promised</small><b>${esc(r.pr)}</b><small style="margin-top:6px">Delivered</small><b>${esc(r.de)}</b>${r.resp?`<span class="resp"><b>Your response</b>${esc(r.resp)}</span>`:`<textarea id="t${r.id}" class="in" rows="3" style="margin-top:10px" placeholder="Reply factually"></textarea><button class="cta" style="margin-top:10px;padding:13px" onclick="reply(${r.id})">Post response</button>`}</span></div>`).join('')||'<p class="mut">No complaints.</p>'}`}
function route(){setTimeout(()=>{let k=location.hash.split('/')[1]||'';if(k==='venue')k='';document.querySelectorAll('.tab').forEach(a=>a.classList.toggle('on',a.dataset.k===k))});
const p=(location.hash||'#/').split('/'),k=p[1]||'',a=p[2];
if(k==='report'){if(a&&!F.venue)F.venue=a;rep();return}
$('#app').innerHTML=({'':home,venue:()=>venue(a),flags,respond}[k]||home)();if(k==='venue')enrich(a)}
let stack=[location.hash||'#/'],pos=0,dir=1,sp={},g=null;
window.addEventListener('hashchange',()=>{const h=location.hash||'#/';sp[stack[pos]]=window.scrollY;
if(stack[pos-1]===h){pos--;dir=-1}else if(stack[pos+1]===h){pos++;dir=1}else{stack=stack.slice(0,pos+1);stack.push(h);pos++;dir=1}
if(!h.startsWith('#/report')){step=0;F={f:[]}}all=false;route();
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)$('#app').animate([{transform:`translateX(${dir*28}px)`,opacity:0},{transform:'none',opacity:1}],{duration:240,easing:'cubic-bezier(.2,.8,.2,1)'});
window.scrollTo(0,dir<0?(sp[h]||0):0)});
const closeRows=ex=>document.querySelectorAll('.sw .li').forEach(l=>{if(l!==ex){l.style.transform='';l.dataset.open=''}});
document.addEventListener('pointerdown',e=>{const r=e.target.closest('.sw');g={x:e.clientX,y:e.clientY,row:r&&r.querySelector('.li'),skip:!!e.target.closest('.cities,input,textarea,select,.stbtn'),btn:!!e.target.closest('.stbtn'),mode:null};if(!r)closeRows()});
document.addEventListener('pointermove',e=>{if(!g||g.btn)return;const dx=e.clientX-g.x,dy=e.clientY-g.y;
if(!g.mode){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy))g.mode='h';else if(Math.abs(dy)>10)g.mode='v'}
if(g.mode==='h'&&g.row){g.row.style.transition='none';g.row.style.transform=`translateX(${Math.max(-92,Math.min(0,(g.row.dataset.open?-92:0)+dx))}px)`;closeRows(g.row)}});
document.addEventListener('pointerup',e=>{if(!g||g.btn){g=null;return}const dx=e.clientX-g.x;
if(g.mode==='h'){window.__sup=true;setTimeout(()=>window.__sup=false,60);
if(g.row){const x=(g.row.dataset.open?-92:0)+dx;g.row.style.transition='';if(x<-46){g.row.style.transform='translateX(-92px)';g.row.dataset.open='1'}else{g.row.style.transform='';g.row.dataset.open=''}}
else if(!g.skip&&Math.abs(dx)>70){dx>0?history.back():history.forward()}}
g=null});
document.addEventListener('pointercancel',()=>{g=null});
document.addEventListener('click',e=>{if(window.__sup){e.preventDefault();e.stopPropagation()}},true);
route();sync();
</script></body></html>
